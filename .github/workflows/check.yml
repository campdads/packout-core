name: Check

# Runs on every pull request and every push to main, and is called by the
# release workflow. Nothing here needs a secret, so a pull request from a
# fork runs all of it.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          coverage: none

      - name: Syntax
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || failed=1
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)
          exit "$failed"

      - name: The version is the same everywhere
        run: php bin/check-versions.php

      - name: The capability page is current
        run: php bin/capabilities-doc.php --check

      - name: Unit tests
        run: php tests/run.php

  standards:
    name: Coding standards and dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Install the tools
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer file and known vulnerabilities
        run: |
          composer validate --strict --no-check-publish
          composer audit --locked

      - name: WordPress coding standards
        run: vendor/bin/phpcs -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          version=8.30.1
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${sha256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the history
        run: '"$RUNNER_TEMP/gitleaks" detect --redact --no-banner --exit-code 1'
