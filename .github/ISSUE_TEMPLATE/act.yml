name: A new or changed act
description: Something a person should be able to do, or a change to who may do it.
labels: ["capability"]
body:
  - type: textarea
    id: act
    attributes:
      label: The act
      description: What the person does, in one sentence.
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: Who may do it
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which plugin has it
      options:
        - Both
        - The hub alone
        - The partner plugin alone
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why
      description: What it is for. When only one plugin has it, why the other does not.
    validations:
      required: true
